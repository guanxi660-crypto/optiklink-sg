name: OptikLink 每日自动登录+服务器保活

on:
  schedule:
    - cron: '0 1 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          # 不装 cloudscraper：本站 CF 认得它的指纹反而 403，普通 requests 能过盾
          pip install requests "requests[socks]" seleniumbase pyvirtualdisplay

      - name: 安装浏览器依赖（Turnstile 需要真实 Chrome + 虚拟显示）
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          # 22.04 和 24.04 包名不同（24.04 加 t64 后缀），两个名字都试
          for p in xvfb libnss3 libdrm2 libxkbcommon0 libgbm1 fonts-liberation \
                   libglib2.0-0 libglib2.0-0t64 libatk1.0-0 libatk1.0-0t64 \
                   libatk-bridge2.0-0 libatk-bridge2.0-0t64 libcups2 libcups2t64 \
                   libasound2 libasound2t64; do
            sudo apt-get install -y -qq "$p" >/dev/null 2>&1 && echo "  ✅ $p" || echo "  ⚠️ $p 跳过"
          done
          python -m seleniumbase install || echo "⚠️ SB 内置浏览器安装失败，运行时再试"
          python -c "import seleniumbase; print('✅ seleniumbase', seleniumbase.__version__)"

      - name: 下载 sing-box
        env:
          SB_FALLBACK_VERSION: "1.14.3"   # API 取不到最新版时的兜底
        run: |
          set -euo pipefail

          sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq jq netcat-openbsd >/dev/null 2>&1

          # 下载 sing-box（优先最新版，API 失败用兜底版本）
          TAG=$(curl -sSL --max-time 15 https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name // empty' 2>/dev/null || true)
          [ -n "$TAG" ] || TAG="v$SB_FALLBACK_VERSION"
          VER="${TAG#v}"
          echo "🔄 下载 sing-box ${VER} ..."
          curl -sSL --fail -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf sb.tar.gz
          mv "sing-box-${VER}-linux-amd64/sing-box" ./sb && chmod +x ./sb
          rm -rf "sing-box-${VER}-linux-amd64" sb.tar.gz   # 压缩包里还有 LICENSE 等文件，rmdir 删不掉非空目录

          # anytls outbound 需要 sing-box >= 1.12.0
          SBV=$(./sb version | head -1 | awk '{print $NF}')
          LOWEST=$(printf '%s\n1.12.0\n' "$SBV" | sort -V | head -1)
          if [ "$LOWEST" != "1.12.0" ]; then
            echo "❌ sing-box ${SBV} 低于 1.12.0，不支持 anytls outbound"; exit 1
          fi
          echo "✅ sing-box ${SBV}（支持 anytls）"

      - name: 选择出口（直连优先，再逐个试节点）
        env:
          PROXY_LINK: ${{ secrets.PROXY_LINK }}
          PROXY_LINK_BACKUP: ${{ secrets.PROXY_LINK_BACKUP }}
          VLESS_NODE: ${{ secrets.VLESS_NODE }}
        run: |
          set -uo pipefail

          N=$(python3 generate_singbox_config.py --count || true)
          N="${N:-0}"
          echo "候选节点数: $N"
          python3 generate_singbox_config.py --list || true

          # 结果通过 $GITHUB_ENV 交给后面的步骤；默认直连（PROXY_URL 为空）
          echo "PROXY_URL=" >> "$GITHUB_ENV"

          SB_PID=""
          stop_sb() {
            if [ -n "$SB_PID" ] && kill -0 "$SB_PID" 2>/dev/null; then
              kill "$SB_PID" 2>/dev/null || true
              wait "$SB_PID" 2>/dev/null || true
            fi
            SB_PID=""
          }
          trap stop_sb EXIT

          WINNER="none"
          EXIT_IP="?"
          SITE_CODE="0"
          VERDICT="ERROR"
          DETAIL=""

          # 解析 probe.json —— 用 python 而不是 jq：jq 是 apt 装的，装失败会静默降级成
          # 「所有节点都不合格」，那才是最难受的故障
          read_probe() {
            VERDICT=$(python3 -c "import json;print(json.load(open('probe.json',encoding='utf-8')).get('verdict','ERROR'))" 2>/dev/null || echo ERROR)
            SITE_CODE=$(python3 -c "import json;print(json.load(open('probe.json',encoding='utf-8')).get('code',0))" 2>/dev/null || echo 0)
            EXIT_IP=$(python3 -c "import json;print(json.load(open('probe.json',encoding='utf-8')).get('exit_ip','?'))" 2>/dev/null || echo '?')
            DETAIL=$(python3 -c "import json;print(json.load(open('probe.json',encoding='utf-8')).get('detail',''))" 2>/dev/null || echo '')
            return 0
          }

          # ── 候选 0：直连。GitHub 运行器在 Azure 美国，大概率根本不需要代理 ──
          echo "──────── 候选 0 / 直连（运行器出口 IP）────────"
          if python3 site_probe.py --timeout 25 --out probe.json; then
            read_probe
            WINNER="direct"
            echo "   ✅ 直连可用，本次完全不用代理"
          else
            read_probe
            case "$VERDICT" in
              WAF_BLOCK) echo "   ✗ 运行器出口 IP 被站点 Cloudflare WAF 拉黑" ;;
              *)         echo "   ✗ 直连不可用（$VERDICT），开始逐个试节点" ;;
            esac

            for i in $(seq 1 "$N"); do
              echo "──────── 候选 #$i / $N ────────"
              stop_sb

              if ! NODE_INFO=$(PROXY_INDEX=$i python3 generate_singbox_config.py --describe); then
                echo "   ❌ 链接解析失败，跳过"; continue
              fi
              read -r NODE_TYPE NODE_ADDR NODE_PORT NODE_NET <<< "$NODE_INFO"
              NODE_NET="${NODE_NET:-tcp}"
              echo "   节点: ${NODE_TYPE} ${NODE_ADDR}:${NODE_PORT}（${NODE_NET^^}）"

              # ① 端口探测。hysteria2 走 QUIC/UDP，**不能拿 TCP 探** ——
              # 它本来就不监听 TCP，探了必然 REFUSED，会把好节点误杀
              if [ "$NODE_NET" = "udp" ]; then
                echo "   ① TCP: 跳过（${NODE_TYPE} 是 QUIC/UDP，TCP 探测无意义）"
              else
                TCP_OUT=$(python3 tcp_probe.py "$NODE_ADDR" "$NODE_PORT" 8)
                TCP_RC=$?
                echo "   ① TCP: ${TCP_OUT}"
                if [ "$TCP_RC" -ne 0 ]; then
                  case "$TCP_RC" in
                    2) echo "      → SYN 被丢（防火墙 DROP / 路由不通 / 节点离线）" ;;
                    3) echo "      → 端口拒绝连接（服务没在监听：端口变了，或节点已下线）" ;;
                    *) echo "      → 连接异常" ;;
                  esac
                  continue
                fi
              fi

              PROXY_INDEX=$i python3 generate_singbox_config.py > config.json || {
                echo "   ❌ 生成配置失败，跳过"; continue; }

              if ! ./sb check -c config.json >/dev/null 2>&1; then
                echo "   ❌ sing-box 配置校验失败："
                ./sb check -c config.json 2>&1 | sed 's/^/      /'
                continue
              fi

              : > sb.log
              ./sb run -c config.json > sb.log 2>&1 &
              SB_PID=$!
              READY=0
              for _ in $(seq 1 20); do
                if nc -z 127.0.0.1 10808 2>/dev/null; then READY=1; break; fi
                sleep 1
              done
              if [ "$READY" -ne 1 ]; then
                echo "   ❌ 本地 socks 端口 10808 未就绪"
                tail -20 sb.log | sed 's/^/      /'
                continue
              fi

              # ② 出站 + 站点：一次请求同时验证「链路通」和「出口没被拉黑」
              echo "   ② 出站 + 站点探测..."
              if python3 site_probe.py --proxy socks5h://127.0.0.1:10808 --timeout 25 --out probe.json; then
                read_probe
                WINNER="#$i"
                echo "   ✅ 节点 #$i 可用"
                break
              fi
              read_probe
              case "$VERDICT" in
                WAF_BLOCK)
                  echo "      → 出口 IP 被站点 WAF 拉黑（换地区，别再用这个 IP）" ;;
                UNREACHABLE)
                  echo "      → 出站拨号不通（TCP 通但握手/转发失败：密码、SNI 或 TLS 参数不对）"
                  tail -20 sb.log | sed 's/^/      /' ;;
                *)
                  echo "      → 不可用，换下一个节点" ;;
              esac
            done
          fi

          if [ "$WINNER" != "none" ]; then
            if [ "$WINNER" = "direct" ]; then
              echo "PROXY_NODE=direct" >> "$GITHUB_ENV"
            else
              echo "PROXY_URL=socks5://127.0.0.1:10808" >> "$GITHUB_ENV"
              echo "PROXY_NODE=$WINNER" >> "$GITHUB_ENV"
            fi
            trap - EXIT        # 这个 sing-box 进程要留给后续步骤，别杀
            {
              echo "### 出口"
              echo ""
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 选用 | $WINNER（候选 0=直连） |"
              echo "| 出口 IP | \`$EXIT_IP\` |"
              echo "| optiklink.net/home | HTTP $SITE_CODE / $VERDICT |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 全军覆没：仍然直连跑一次，让浏览器自己去试（curl 被拦 ≠ 浏览器被拦）
          trap - EXIT
          echo "PROXY_NODE=none" >> "$GITHUB_ENV"
          echo "::warning title=没有可用出口::直连和全部 $N 个节点都没通过探测，仍将用直连尝试一次。"
          {
            echo "### ⚠️ 没有可用出口"
            echo ""
            echo "直连 + $N 个候选节点全部未通过探测，本次仍用直连跑一次（浏览器可能比探测脚本更能过盾）。"
            echo "若登录失败，先换一个**非香港 / 非俄罗斯**出口的节点 —— 这两个地区的 IP 实测被站点 WAF 拦。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 执行自动登录+服务器保活脚本
        id: login
        env:
          DISCORD_TOKEN:        ${{ secrets.DISCORD_TOKEN }}
          BOT_TOKEN:            ${{ secrets.BOT_TOKEN }}
          CHAT_ID:              ${{ secrets.CHAT_ID }}
          DISCORD_CLIENT_ID:    ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_REDIRECT_URI: ${{ secrets.DISCORD_REDIRECT_URI }}
          EXPIRE_DATE:          ${{ secrets.EXPIRE_DATE }}
          PROXY_URL:            ${{ env.PROXY_URL }}
          PROXY_NODE:           ${{ env.PROXY_NODE }}
          PANEL_API_KEY:        ${{ secrets.PANEL_API_KEY }}
          PANEL_SERVER_ID:      ${{ secrets.PANEL_SERVER_ID }}
          PANEL_URL:            "https://control.optiklink.net"
          SERVER_START_WAIT:    "60"
        run: |
          # 跨步骤的后台进程理论上能活，但不赌：代理没在跑就先拉起来
          if [ -n "${PROXY_URL:-}" ] && ! nc -z 127.0.0.1 10808 2>/dev/null; then
            echo "⚠️ 代理进程已不在，用上次选中的配置重启 sing-box"
            ./sb run -c config.json > sb.log 2>&1 &
            for _ in $(seq 1 20); do
              nc -z 127.0.0.1 10808 2>/dev/null && break
              sleep 1
            done
          fi
          if [ -z "${PROXY_URL:-}" ]; then
            echo "⚠️ 无可用代理，本次直连执行"
          fi
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python -u optiklink_login.py

      # 说明：原来的「自动更新 DISCORD_CLIENT_ID Secret」步骤已删除 ——
      # GITHUB_TOKEN 没有写 Secret 的权限，gh secret set 必然 403，这一步只会把
      # 本来成功的运行标红。client_id 变化时改用脚本内置的兜底值 + 手动更新 Secret。

      - name: 提交 time.txt 保持仓库活跃
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只往当前分支推，避免手动 dispatch 非 main 分支时把代码推去 main
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin "HEAD:${BRANCH}"
          fi

  cleanup-old-runs:
    runs-on: ubuntu-latest
    needs: auto-login
    if: always()
    permissions:
      actions: write
    steps:
      - name: 删除多余的 workflow run（保留最新 2 条）
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 2;
            const workflowName = "OptikLink 每日自动登录+服务器保活";
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo:  context.repo.repo,
            });
            const wf = workflows.data.workflows.find(w => w.name === workflowName);
            if (!wf) {
              console.log("未找到 workflow，跳过清理");
              return;
            }
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                workflow_id: wf.id,
                per_page:    100,
              }
            );
            const toDelete = runs.slice(KEEP);
            console.log(`共 ${runs.length} 条 run，保留 ${KEEP} 条，删除 ${toDelete.length} 条`);
            for (const run of toDelete) {
              await github.rest.actions.deleteWorkflowRun({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                run_id: run.id,
              });
              console.log(`已删除 run #${run.run_number} (id=${run.id})`);
            }
